<html lang="en">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bay: { 950:'#0a0f1a',900:'#0f172a',800:'#1e293b',700:'#334155',600:'#475569',500:'#64748b',400:'#94a3b8',300:'#cbd5e1',200:'#e2e8f0',100:'#f1f5f9' },
            accent: '#22d3ee', success: '#34d399', warning: '#fbbf24', danger: '#f87171', purple: '#a78bfa'
          },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <style>
    html,body,#root{height:100%;margin:0;background:#0a0f1a;color:#f1f5f9;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
    .page-enter{animation:fadeSlideIn .22s ease-out}
    @keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ========== DATA ==========
    const CATEGORIES = ['Fluids','Filters','Brakes','Tires & Alignment','Battery & Electrical','Inspection'];

    const services = [
      {

        tags: ['oil','filter','maintenance','engine'],
        importance: 'Engine oil is the lifeblood of the vehicle. It lubricates moving parts, reduces friction, carries away heat, and traps contaminants. Fresh oil with a clean filter keeps the engine running cooler, quieter, and lasting far longer.',

          { objection: "It's too expensive / I'll do it cheaper somewhere else.", response: "I understand wanting value. The difference with us is the quality of oil, the correct filter, and the inspection we do. A bad oil change can actually hurt the engine." },

        ],
        tips: ['Show the old filter and oil if dirty — visual proof sells.', 'Mention the free multi-point inspection.'],
        estimatedTime: '25–40 min', averageTicket: '$65–$120'
      },
      {
        id: 'cabin-air-filter', name: 'Cabin Air Filter', category: 'Filters',
        tags: ['cabin','filter','ac','air quality'],
        importance: 'The cabin air filter cleans the air that enters the passenger compartment. A clogged filter reduces airflow, strains the blower motor, and lets dust and pollen into the car.',
        doOnTime: 'Stronger airflow, better A/C performance, cleaner air for passengers, longer blower motor life.',
        delayEffect: 'Reduced cooling, musty odors, increased strain on the blower motor, poor air quality.',
        scripts: {
          beginner: "Your cabin filter is dirty. This cleans the air you and your passengers breathe. Replacing it improves airflow and A/C performance. Want us to replace it?",
          intermediate: "I pulled the cabin filter and it's loaded with debris. When this clogs, the A/C has to work harder. It's a quick inexpensive job that makes a noticeable difference.",
          closer: "This cabin filter is overdue and restricting airflow. You're not getting full A/C performance and the blower motor is working overtime. Replacing it now is cheap insurance."

        estimatedTime: '10–20 min', averageTicket: '$35–$65'

      {

        doOnTime: 'Better throttle response, improved fuel economy, protection against premature engine wear.',
        delayEffect: 'Restricted airflow reduces power and fuel economy. Dirt acts like sandpaper inside the engine.',
        scripts: {
          beginner: "Your engine air filter is dirty. A clean filter helps the engine breathe better for performance and fuel economy. It's a quick replacement.",
          intermediate: "The engine air filter is restricting airflow. When the engine can't get enough clean air, you lose power and burn more gas.",

      {

        tags: ['transmission','fluid','flush'],
        importance: 'Transmission fluid lubricates, cools, and provides hydraulic pressure. Over time it breaks down and loses its ability to protect expensive internal components.',

        scripts: {

          closer: "The transmission fluid is past its useful life. Continuing to drive on degraded fluid is one of the fastest ways to destroy a transmission. This is one of the highest-ROI services we offer."

    const softSkills = {
      dailyChecklist: [
        { id: 'walkaround', title: 'Vehicle Walk-Around', description: 'Perform a thorough multi-point inspection and note every concern before talking to the customer.' },
        { id: 'listen-first', title: 'Listen Before Recommending', description: 'Ask what concerns the customer already has. Build recommendations around their priorities.' },
        { id: 'show-dont-tell', title: 'Show the Evidence', description: 'Bring the old filter, show the fluid color, display the battery test. Visuals close more tickets.' },
        { id: 'priority-order', title: 'Present by Priority', description: 'Safety items first, then items that prevent expensive failures, then convenience items.' },
        { id: 'ask-for-the-sale', title: 'Ask for the Sale', description: 'After presenting value, clearly ask: "Would you like us to take care of that today?"' },
        { id: 'follow-up', title: 'Same-Day Follow-Up', description: 'Text or call declined recommendations the same day with a short value reminder.' }
      ],
      objectionDrills: [
        { id: 'too-expensive', title: '“It’s too expensive”', goodResponse: 'I understand. The price reflects the quality of parts and the inspection. Skipping it often costs more later. Which part feels highest priority right now?' },
        { id: 'do-it-later', title: '“I’ll do it later”', goodResponse: 'The damage is already starting. While the vehicle is here, this is the lowest-cost time to handle it. Waiting usually turns a small job into a bigger one.' },
        { id: 'other-shop', title: '“My other shop never mentioned this”', goodResponse: 'Different shops have different standards. We check condition, not just the sticker date. I’d rather tell you early than have you come back with a bigger problem.' },
        { id: 'dont-need-it', title: '“I don’t think I need that”', goodResponse: 'Fair enough. Can I show you what we found? Sometimes seeing the actual condition makes it clearer. No pressure either way.' }
      ],
      followUpScripts: [
        { id: 'same-day', title: 'Same-Day Text (Declined Item)', script: 'Hi [Name], this is [Your Name] at [Shop]. Quick follow-up on the [Service] we talked about. It’s one of the better ways to avoid a bigger repair later. Happy to get you scheduled — just reply.' },
        { id: 'three-day', title: '3-Day Follow-Up', script: 'Hi [Name], this is [Your Name] from [Shop]. Checking in about the [Service] we recommended. Have you had a chance to think it over? Happy to answer questions or get you on the schedule.' }
      ],
      upsellFrameworks: [
        {
          id: 'oil-to-ticket',
          title: 'Turning a $60 Oil Change into a $300–$400 Ticket',
          steps: [
            'Always perform a real multi-point inspection.',
            'Prioritize: Safety → Prevents expensive failure → Comfort.',
            'Present no more than 3–4 items at once.',
            'Use visuals (old parts, test results).',
            'Bundle related items.',
            'Ask for the sale on the highest-priority item first.',
            'Offer to stage remaining items for the next visit if needed.'
          ]
        }
      ]
    };

    // ========== SIMPLE ROUTER ==========
    function useHashRoute() {
      const [path, setPath] = useState(window.location.hash.slice(1) || '/');
      useEffect(() => {
        const onHash = () => setPath(window.location.hash.slice(1) || '/');
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      const navigate = (to) => { window.location.hash = to; };
      return [path, navigate];
    }

    // ========== ICONS (simple SVG) ==========
    const Icon = ({ d, size=20, className='' }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d={d} />
      </svg>
    );
    const icons = {
      home: "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
      wrench: "M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z",
      brain: "M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2zm5 0a2.5 2.5 0 0 1 2.46 2.04 2.5 2.5 0 0 1 1.32 4.24 3 3 0 0 1-.34 5.58 2.5 2.5 0 0 1-2.96 3.08A2.5 2.5 0 0 1 12 19.5v-15A2.5 2.5 0 0 1 14.5 2z",
      target: "M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12z M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",
      settings: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z",
      search: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.35-4.35",
      check: "M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4L12 14.01l-3-3",
      x: "M18 6L6 18 M6 6l12 12",
      arrow: "M5 12h14 M12 5l7 7-7 7",
      flame: "M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z",
      chevron: "M6 9l6 6 6-6"
    };

    // ========== PAGES ==========
    function HomePage({ navigate, streak }) {
      const [search, setSearch] = useState('');
      const [checked, setChecked] = useState(() => {
        try { return JSON.parse(localStorage.getItem('baytips-checklist') || '{}'); } catch { return {}; }
      });
      const toggle = (id) => {
        const next = { ...checked, [id]: !checked[id] };
        setChecked(next);
        localStorage.setItem('baytips-checklist', JSON.stringify(next));
      };
      const filtered = search.trim()
        ? services.filter(s => s.name.toLowerCase().includes(search.toLowerCase()) || s.category.toLowerCase().includes(search.toLowerCase()))
        : [];
      const done = Object.values(checked).filter(Boolean).length;

      return (
        <div className="page-enter px-4 pt-6 pb-8">
          <div className="flex items-center justify-between mb-6">
            <div>
              <h1 className="text-2xl font-bold text-white">BayTips</h1>
              <p className="text-sm text-bay-400 mt-0.5">Advisor & Tech Training</p>
            </div>
            <div className="flex items-center gap-1.5 bg-bay-800/80 px-3 py-1.5 rounded-full border border-bay-700">
              <Icon d={icons.flame} size={16} className="text-orange-400" />
              <span className="text-sm font-semibold text-white">{streak}</span>
              <span className="text-xs text-bay-400">day</span>
            </div>
          </div>

          <div className="relative mb-6">
            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-bay-500"><Icon d={icons.search} size={18} /></div>

              className="w-full bg-bay-900 border border-bay-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder:text-bay-500 focus:outline-none focus:border-accent" />
          </div>

          {search.trim() ? (
            <div className="space-y-2">
              <p className="text-xs text-bay-500 uppercase tracking-wider">{filtered.length} results</p>
              {filtered.map(s => (
                <button key={s.id} onClick={() => navigate('/service/' + s.id)} className="card-interactive w-full flex items-center justify-between bg-bay-900 border border-bay-800 rounded-xl px-4 py-3 text-left">
                  <div><p className="font-medium text-white">{s.name}</p><p className="text-xs text-bay-400 mt-0.5">{s.category}</p></div>
                  <Icon d={icons.arrow} size={16} className="text-bay-500" />
                </button>
              ))}
            </div>
          ) : (
            <>
              <section className="mb-8">
                <div className="flex items-center justify-between mb-3">
                  <h2 className="text-sm font-semibold text-bay-300 uppercase tracking-wider">Daily Checklist</h2>
                  <span className="text-xs text-accent font-medium">{done}/{softSkills.dailyChecklist.length}</span>
                </div>
                <div className="space-y-2">
                  {softSkills.dailyChecklist.map(item => (
                    <button key={item.id} onClick={() => toggle(item.id)}
                      className={`card-interactive w-full flex items-start gap-3 text-left bg-bay-900 border rounded-xl px-4 py-3 ${checked[item.id] ? 'border-success/40 bg-success/5' : 'border-bay-800'}`}>
                      <Icon d={icons.check} size={20} className={`mt-0.5 shrink-0 ${checked[item.id] ? 'text-success' : 'text-bay-600'}`} />
                      <div>
                        <p className={`text-sm font-medium ${checked[item.id] ? 'text-success line-through opacity-70' : 'text-white'}`}>{item.title}</p>
                        <p className="text-xs text-bay-400 mt-0.5 leading-relaxed">{item.description}</p>
                      </div>
                    </button>
                  ))}
                </div>
              </section>

              <section className="mb-8">
                <h2 className="text-sm font-semibold text-bay-300 uppercase tracking-wider mb-3">Quick Access</h2>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => navigate('/services')} className="card-interactive bg-bay-900 border border-bay-800 rounded-xl p-4 text-left">
                    <p className="font-medium text-white text-sm">All Services</p>
                    <p className="text-xs text-bay-400 mt-0.5">{services.length} guides</p>
                  </button>
                  <button onClick={() => navigate('/soft-skills')} className="card-interactive bg-bay-900 border border-bay-800 rounded-xl p-4 text-left">
                    <p className="font-medium text-white text-sm">Soft Skills</p>
                    <p className="text-xs text-bay-400 mt-0.5">Scripts & drills</p>
                  </button>
                  <button onClick={() => navigate('/practice')} className="card-interactive bg-bay-900 border border-bay-800 rounded-xl p-4 text-left">
                    <p className="font-medium text-white text-sm">Practice</p>
                    <p className="text-xs text-bay-400 mt-0.5">Quizzes</p>
                  </button>
                  <button onClick={() => navigate('/services')} className="card-interactive bg-gradient-to-br from-cyan-500/20 to-cyan-500/5 border border-cyan-500/30 rounded-xl p-4 text-left">
                    <p className="font-medium text-white text-sm">Find a Service</p>
                    <p className="text-xs text-bay-300 mt-0.5">Live search</p>
                  </button>
                </div>
              </section>

              <section>
                <div className="flex items-center justify-between mb-3">
                  <h2 className="text-sm font-semibold text-bay-300 uppercase tracking-wider">Core Services</h2>
                  <button onClick={() => navigate('/services')} className="text-xs text-accent font-medium">View all →</button>
                </div>
                <div className="space-y-2">
                  {services.slice(0,4).map(s => (
                    <button key={s.id} onClick={() => navigate('/service/' + s.id)} className="card-interactive w-full flex items-center justify-between bg-bay-900 border border-bay-800 rounded-xl px-4 py-3.5 text-left">
                      <div><p className="font-medium text-white">{s.name}</p><p className="text-xs text-bay-400 mt-0.5">{s.category} · {s.averageTicket}</p></div>
                      <Icon d={icons.arrow} size={16} className="text-bay-500" />
                    </button>
                  ))}
                </div>
              </section>
            </>
          )}
        </div>
      );
    }

    function ServicesPage({ navigate }) {
      const [search, setSearch] = useState('');
      const [cat, setCat] = useState(null);
      const filtered = useMemo(() => {
        let list = services;
        if (cat) list = list.filter(s => s.category === cat);
        if (search.trim()) {
          const q = search.toLowerCase();
          list = list.filter(s => s.name.toLowerCase().includes(q) || s.category.toLowerCase().includes(q));
        }
        return list;
      }, [search, cat]);

      return (
        <div className="page-enter px-4 pt-6 pb-8">
          <h1 className="text-2xl font-bold text-white mb-1">Services</h1>
          <p className="text-sm text-bay-400 mb-5">{services.length} training guides</p>
          <div className="relative mb-4">
            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-bay-500"><Icon d={icons.search} size={18} /></div>
            <input type="search" placeholder="Type to filter..." value={search} onChange={e => setSearch(e.target.value)}
              className="w-full bg-bay-900 border border-bay-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder:text-bay-500 focus:outline-none focus:border-accent" />
          </div>
          <div className="flex gap-2 overflow-x-auto pb-3 mb-4 -mx-4 px-4">
            <button onClick={() => setCat(null)} className={`shrink-0 px-3.5 py-1.5 rounded-full text-xs font-medium border ${cat === null ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300' : 'bg-bay-900 border-bay-700 text-bay-400'}`}>All</button>
            {CATEGORIES.map(c => (
              <button key={c} onClick={() => setCat(c === cat ? null : c)} className={`shrink-0 px-3.5 py-1.5 rounded-full text-xs font-medium border ${cat === c ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300' : 'bg-bay-900 border-bay-700 text-bay-400'}`}>{c}</button>
            ))}
          </div>
          <p className="text-xs text-bay-500 mb-3">Showing {filtered.length} of {services.length}</p>
          <div className="space-y-2">
            {filtered.map(s => (
              <button key={s.id} onClick={() => navigate('/service/' + s.id)} className="card-interactive w-full flex items-center justify-between bg-bay-900 border border-bay-800 rounded-xl px-4 py-3.5 text-left">
                <div className="min-w-0">
                  <p className="font-medium text-white truncate">{s.name}</p>
                  <div className="flex items-center gap-2 mt-1">
                    <span className="text-[11px] px-2 py-0.5 rounded-md bg-bay-800 text-bay-300">{s.category}</span>
                    <span className="text-xs text-bay-500">{s.averageTicket}</span>
                  </div>
                </div>
                <Icon d={icons.arrow} size={16} className="text-bay-500 shrink-0 ml-3" />
              </button>
            ))}
          </div>
        </div>
      );
    }

    function ServiceDetailPage({ id, navigate }) {
      const service = services.find(s => s.id === id);
      const [level, setLevel] = useState('beginner');
      const [openObj, setOpenObj] = useState(0);
      if (!service) return <div className="px-4 pt-12 text-center"><p className="text-bay-400">Service not found.</p><button onClick={() => navigate('/services')} className="text-accent text-sm mt-4">← Back</button></div>;
      const levels = [
        { key: 'beginner', label: 'Beginner', active: 'text-success border-success/40 bg-success/10' },
        { key: 'intermediate', label: 'Intermediate', active: 'text-warning border-warning/40 bg-warning/10' },
        { key: 'closer', label: 'Closer', active: 'text-accent border-accent/40 bg-accent/10' }
      ];
      return (
        <div className="page-enter min-h-full">
          <div className="sticky top-0 z-40 bg-bay-950/95 backdrop-blur-md border-b border-bay-800 px-4 py-3 flex items-center gap-3">
            <button onClick={() => navigate('/services')} className="p-2 -ml-2 rounded-lg text-bay-300"><Icon d="M19 12H5M12 19l-7-7 7-7" size={20} /></button>
            <div className="min-w-0 flex-1">
              <h1 className="font-semibold text-white truncate">{service.name}</h1>
              <p className="text-xs text-bay-400">{service.category}</p>
            </div>
          </div>
          <div className="px-4 pt-5 pb-10 space-y-6">
            <div className="flex flex-wrap gap-2">
              <span className="text-xs bg-bay-900 border border-bay-700 rounded-lg px-2.5 py-1.5 text-bay-300">{service.estimatedTime}</span>
              <span className="text-xs bg-bay-900 border border-bay-700 rounded-lg px-2.5 py-1.5 text-bay-300">{service.averageTicket}</span>
            </div>
            <section>
              <h2 className="text-xs font-semibold text-bay-400 uppercase tracking-wider mb-2">Why It Matters</h2>
              <div className="bg-bay-900 border border-bay-800 rounded-xl p-4"><p className="text-sm text-bay-200 leading-relaxed">{service.importance}</p></div>
            </section>
            <section>
              <h2 className="text-xs font-semibold text-bay-400 uppercase tracking-wider mb-2">Cause & Effect</h2>
              <div className="grid gap-3">
                <div className="bg-success/5 border border-success/25 rounded-xl p-4">
                  <p className="text-sm font-semibold text-success mb-2">Do it on time</p>
                  <p className="text-sm text-bay-200 leading-relaxed">{service.doOnTime}</p>
                </div>
                <div className="bg-danger/5 border border-danger/25 rounded-xl p-4">
                  <p className="text-sm font-semibold text-danger mb-2">If delayed / ignored</p>
                  <p className="text-sm text-bay-200 leading-relaxed">{service.delayEffect}</p>
                </div>
              </div>
            </section>
            <section>
              <h2 className="text-xs font-semibold text-bay-400 uppercase tracking-wider mb-3">Sales Script</h2>
              <div className="flex gap-2 mb-3">
                {levels.map(l => (
                  <button key={l.key} onClick={() => setLevel(l.key)} className={`flex-1 py-2 rounded-lg text-xs font-semibold border ${level === l.key ? l.active : 'bg-bay-900 border-bay-700 text-bay-400'}`}>{l.label}</button>
                ))}
              </div>
              <div className="bg-bay-900 border border-bay-800 rounded-xl p-4">
                <p className="text-sm text-bay-100 leading-relaxed">“{service.scripts[level]}”</p>
              </div>
            </section>
            <section>
              <h2 className="text-xs font-semibold text-bay-400 uppercase tracking-wider mb-3">Common Objections</h2>
              <div className="space-y-2">
                {(service.objections || []).map((obj, i) => (
                  <div key={i} className="bg-bay-900 border border-bay-800 rounded-xl overflow-hidden">
                    <button onClick={() => setOpenObj(openObj === i ? null : i)} className="w-full flex items-center justify-between px-4 py-3 text-left">
                      <span className="text-sm font-medium text-white pr-2">“{obj.objection}”</span>
                      <Icon d={icons.chevron} size={16} className={`text-bay-500 transition-transform ${openObj === i ? 'rotate-180' : ''}`} />
                    </button>
                    {openObj === i && (
                      <div className="px-4 pb-4">
                        <div className="bg-bay-800/60 rounded-lg p-3 border border-bay-700">
                          <p className="text-xs text-accent font-medium mb-1.5">Suggested response</p>
                          <p className="text-sm text-bay-200 leading-relaxed">{obj.response}</p>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </section>
            {(service.tips || []).length > 0 && (
              <section>
                <h2 className="text-xs font-semibold text-bay-400 uppercase tracking-wider mb-2">Pro Tips</h2>
                <ul className="space-y-2">
                  {service.tips.map((tip, i) => (
                    <li key={i} className="flex gap-2.5 text-sm text-bay-300 bg-bay-900 border border-bay-800 rounded-lg px-3.5 py-2.5">
                      <span className="text-accent font-bold shrink-0">{i+1}.</span>
                      <span className="leading-relaxed">{tip}</span>
                    </li>
                  ))}
                </ul>
              </section>
            )}
          </div>
        </div>
      );
    }

    function SoftSkillsPage() {
      const [tab, setTab] = useState('objections');
      const [openId, setOpenId] = useState(null);
      return (
        <div className="page-enter px-4 pt-6 pb-8">
          <h1 className="text-2xl font-bold text-white mb-1">Soft Skills</h1>
          <p className="text-sm text-bay-400 mb-5">Scripts & frameworks that close more tickets</p>
          <div className="flex gap-1 p-1 bg-bay-900 rounded-xl border border-bay-800 mb-6">
            {['objections','followups','upsell'].map(t => (
              <button key={t} onClick={() => { setTab(t); setOpenId(null); }}
                className={`flex-1 py-2.5 rounded-lg text-xs font-semibold capitalize ${tab === t ? 'bg-bay-800 text-white' : 'text-bay-400'}`}>{t}</button>
            ))}
          </div>
          {tab === 'objections' && (
            <div className="space-y-3">
              {softSkills.objectionDrills.map(d => (
                <div key={d.id} className="bg-bay-900 border border-bay-800 rounded-xl overflow-hidden">
                  <button onClick={() => setOpenId(openId === d.id ? null : d.id)} className="w-full flex items-center justify-between px-4 py-3.5 text-left">
                    <span className="text-sm font-medium text-white">{d.title}</span>
                    <Icon d={icons.chevron} size={16} className={`text-bay-500 ${openId === d.id ? 'rotate-180' : ''}`} />
                  </button>
                  {openId === d.id && (
                    <div className="px-4 pb-4">
                      <div className="bg-success/5 border border-success/20 rounded-lg p-3.5">
                        <p className="text-xs text-success font-medium mb-1.5">Strong response</p>
                        <p className="text-sm text-bay-200 leading-relaxed">{d.goodResponse}</p>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
          {tab === 'followups' && (
            <div className="space-y-3">
              {softSkills.followUpScripts.map(s => (
                <div key={s.id} className="bg-bay-900 border border-bay-800 rounded-xl p-4">
                  <h3 className="text-sm font-semibold text-white mb-2">{s.title}</h3>
                  <p className="text-sm text-bay-300 leading-relaxed bg-bay-800/50 rounded-lg p-3 border border-bay-700">{s.script}</p>
                </div>
              ))}
            </div>
          )}
          {tab === 'upsell' && (
            <div className="space-y-4">
              {softSkills.upsellFrameworks.map(fw => (
                <div key={fw.id} className="bg-bay-900 border border-bay-800 rounded-xl p-4">
                  <h3 className="text-sm font-semibold text-white mb-3">{fw.title}</h3>
                  <ol className="space-y-2.5">
                    {fw.steps.map((step, i) => (
                      <li key={i} className="flex gap-2.5 text-sm text-bay-300">
                        <span className="text-accent font-bold shrink-0 w-5">{i+1}.</span>
                        <span className="leading-relaxed">{step}</span>
                      </li>
                    ))}
                  </ol>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function PracticePage() {
      const questions = [
        { prompt: 'Customer says “I’ll do the transmission service later.” Best response direction?', options: ['Agree and move on', 'Explain damage is already starting and today is lowest-cost time', 'Offer a big discount', 'Say it will fail next week'], correct: 1, explanation: 'Connecting delay to ongoing damage + convenience of doing it now is honest and effective.' },
        { prompt: 'Order for presenting multiple recommendations?', options: ['Highest profit first', 'Easiest first', 'Safety → Prevents expensive failure → Comfort', 'Whatever tech listed first'], correct: 2, explanation: 'Safety builds trust. Then protection against big bills. Comfort last.' },
        { prompt: 'Best visual to close a cabin air filter?', options: ['Printed schedule', 'Show the dirty old filter', 'Long technical explanation', 'Compare prices'], correct: 1, explanation: 'Seeing the black clogged filter is far more persuasive than words.' },
        { prompt: 'Why does brake fluid absorbing moisture matter?', options: ['Changes color', 'Lowers boiling point and corrodes ABS components', 'Makes it smell', 'Only matters on race cars'], correct: 1, explanation: 'Moisture drops boiling point and causes internal corrosion in expensive ABS parts.' },
        { prompt: 'Best way to grow an oil change ticket without overselling?', options: ['Recommend everything every time', 'Real multi-point inspection + 3–4 prioritized findings with visuals', 'Always add cabin filter and wipers', 'Pressure on safety for every item'], correct: 1, explanation: 'Real inspection + prioritization + visuals + asking for the sale is the professional path.' }
      ];
      const [current, setCurrent] = useState(0);
      const [selected, setSelected] = useState(null);
      const [score, setScore] = useState(0);
      const [finished, setFinished] = useState(false);
      const [showExp, setShowExp] = useState(false);
      const q = questions[current];

      const select = (idx) => {
        if (selected !== null) return;
        setSelected(idx);
        setShowExp(true);
        if (idx === q.correct) setScore(s => s + 1);
      };
      const next = () => {
        if (current + 1 >= questions.length) setFinished(true);
        else { setCurrent(c => c + 1); setSelected(null); setShowExp(false); }
      };
      const reset = () => { setCurrent(0); setSelected(null); setScore(0); setFinished(false); setShowExp(false); };

      if (finished) {
        const pct = Math.round((score / questions.length) * 100);
        return (
          <div className="page-enter px-4 pt-12 pb-8 text-center">
            <h1 className="text-2xl font-bold text-white mb-2">Quiz Complete</h1>
            <p className="text-bay-400 mb-6">You scored <span className="text-white font-semibold">{score}/{questions.length}</span> ({pct}%)</p>
            <button onClick={reset} className="bg-accent text-bay-950 font-semibold px-5 py-3 rounded-xl">Try Again</button>
          </div>
        );
      }

      return (
        <div className="page-enter px-4 pt-6 pb-8">
          <div className="flex items-center justify-between mb-6">
            <div>
              <h1 className="text-2xl font-bold text-white">Practice</h1>
              <p className="text-sm text-bay-400">Quick quizzes</p>
            </div>
            <div className="text-sm font-medium text-bay-300 bg-bay-900 border border-bay-700 rounded-lg px-3 py-1.5">{current+1}/{questions.length}</div>
          </div>
          <div className="h-1.5 bg-bay-800 rounded-full mb-6 overflow-hidden">
            <div className="h-full bg-accent transition-all" style={{width: `${((current + (selected!==null?1:0))/questions.length)*100}%`}} />
          </div>
          <div className="bg-bay-900 border border-bay-800 rounded-xl p-5 mb-5">
            <p className="text-sm font-medium text-white leading-relaxed">{q.prompt}</p>
          </div>
          <div className="space-y-2.5 mb-6">
            {q.options.map((opt, idx) => {
              let style = 'bg-bay-900 border-bay-800 text-bay-200';
              if (selected !== null) {
                if (idx === q.correct) style = 'bg-success/10 border-success/50 text-success';
                else if (idx === selected) style = 'bg-danger/10 border-danger/50 text-danger';
                else style = 'bg-bay-900 border-bay-800 text-bay-500 opacity-60';
              }
              return (
                <button key={idx} onClick={() => select(idx)} disabled={selected !== null}
                  className={`w-full text-left px-4 py-3.5 rounded-xl border text-sm ${style}`}>{opt}</button>
              );
            })}
          </div>
          {showExp && (
            <div className="bg-bay-800/60 border border-bay-700 rounded-xl p-4 mb-5">
              <p className="text-xs text-accent font-medium mb-1">Explanation</p>
              <p className="text-sm text-bay-300 leading-relaxed">{q.explanation}</p>
            </div>
          )}
          {selected !== null && (
            <button onClick={next} className="w-full bg-accent text-bay-950 font-semibold py-3.5 rounded-xl">
              {current + 1 >= questions.length ? 'See Results' : 'Next Question'}
            </button>
          )}
        </div>
      );
    }

    function SettingsPage() {
      const [streak, setStreak] = useState(0);
      useEffect(() => {
        setStreak(parseInt(localStorage.getItem('baytips-streak') || '0', 10));
      }, []);
      const clear = () => {
        if (confirm('Clear all local data?')) {
          localStorage.removeItem('baytips-checklist');
          localStorage.removeItem('baytips-streak');
          setStreak(0);
        }
      };
      return (
        <div className="page-enter px-4 pt-6 pb-8">
          <h1 className="text-2xl font-bold text-white mb-1">Settings</h1>
          <p className="text-sm text-bay-400 mb-6">BayTips · Standalone</p>
          <div className="bg-bay-900 border border-bay-800 rounded-xl p-4 mb-6 flex justify-between">
            <div><p className="text-sm text-bay-300">Current streak</p><p className="text-2xl font-bold text-white mt-0.5">{streak} days</p></div>
            <div className="text-right"><p className="text-sm text-bay-300">Services</p><p className="text-2xl font-bold text-accent mt-0.5">{services.length}</p></div>
          </div>
          <div className="bg-bay-900 border border-bay-800 rounded-xl p-4 mb-6 text-sm text-bay-300 leading-relaxed">
            <p><strong className="text-white">BayTips</strong> helps advisors and techs close more recommendations and build customer trust.</p>
            <p className="text-xs text-bay-500 mt-2">Version 0.1.1 · Local data only</p>
          </div>
          <button onClick={clear} className="w-full border border-danger/40 text-danger py-3 rounded-xl text-sm font-medium">Clear Local Data</button>
        </div>
      );
    }

    // ========== APP ==========
    function App() {
      const [path, navigate] = useHashRoute();
      const [streak, setStreak] = useState(0);

      useEffect(() => {
        const today = new Date().toDateString();
        const last = localStorage.getItem('baytips-last-visit');
        let current = parseInt(localStorage.getItem('baytips-streak') || '0', 10);
        if (last !== today) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          if (last === yesterday.toDateString()) current += 1;
          else current = 1;
          localStorage.setItem('baytips-streak', String(current));
          localStorage.setItem('baytips-last-visit', today);
        }
        setStreak(current);
      }, []);

      const isService = path.startsWith('/service/');
      const serviceId = isService ? path.replace('/service/', '') : null;

      const tabs = [
        { path: '/', label: 'Home', icon: icons.home },
        { path: '/services', label: 'Services', icon: icons.wrench },
        { path: '/soft-skills', label: 'Skills', icon: icons.brain },
        { path: '/practice', label: 'Practice', icon: icons.target },
        { path: '/settings', label: 'Settings', icon: icons.settings }
      ];

      return (
        <div className="min-h-full flex flex-col max-w-lg mx-auto relative bg-bay-950">
          <div className="flex-1 pb-20">
            {path === '/' && <HomePage navigate={navigate} streak={streak} />}
            {path === '/services' && <ServicesPage navigate={navigate} />}
            {isService && <ServiceDetailPage id={serviceId} navigate={navigate} />}
            {path === '/soft-skills' && <SoftSkillsPage />}
            {path === '/practice' && <PracticePage />}
            {path === '/settings' && <SettingsPage />}
          </div>
          {!isService && (
            <nav className="fixed bottom-0 left-0 right-0 z-50 bg-bay-900/95 backdrop-blur-lg border-t border-bay-800 safe-bottom">
              <div className="flex items-stretch h-16 max-w-lg mx-auto">
                {tabs.map(t => {
                  const active = path === t.path || (t.path !== '/' && path.startsWith(t.path));
                  return (
                    <button key={t.path} onClick={() => navigate(t.path)}
                      className={`flex flex-col items-center justify-center gap-0.5 flex-1 py-2 text-[10px] font-medium ${active ? 'text-accent' : 'text-bay-500'}`}>
                      <Icon d={t.icon} size={20} />
                      <span>{t.label}</span>
                    </button>
                  );
                })}
              </div>
            </nav>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
