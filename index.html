<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="BayTips — Training guides and sales scripts for automotive service advisors and lube technicians." />
  <title>BayTips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bay: {
              950: '#0a0f1a',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
              600: '#475569',
              500: '#64748b',
              400: '#94a3b8',
              300: '#cbd5e1',
              200: '#e2e8f0',
              100: '#f1f5f9',
            },
            accent: '#22d3ee',
            'accent-dim': '#0891b2',
            success: '#34d399',
            warning: '#fbbf24',
            danger: '#f87171',
            purple: '#a78bfa',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    html, body, #root { height: 100%; margin: 0; background: #0a0f1a; color: #f1f5f9; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .page-enter { animation: fadeSlideIn 0.22s ease-out; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card-interactive { transition: transform 0.12s ease, border-color 0.12s ease; }
    .card-interactive:active { transform: scale(0.98); }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <p style="padding:2rem;color:#94a3b8;text-align:center;font-family:system-ui">
    Loading BayTips…<br><br>
    If this stays blank, the full app needs to be served over HTTPS (not opened as a local file).<br><br>
    Go to the GitHub repo and enable GitHub Pages, or ask me to finish deploying the complete version.
  </p>
</body>
</html>
